openapi: 3.0.3
info:
  title: SVINN IRI Case API (Platform)
  version: 0.0.3
  description: >
    Platform CaseStatus from packages/case-api/src/case_api/case_sm.py.
    NOT jsm.status_map keys and NOT CTO shorthand
    (HOLD, CHALLENGE, RELEASED, EXECUTING, AUTHORIZED_PENDING_RELEASE,
    OPEN, ACTION_READY, CLOSED).
    hold_expired → DENIED. JSM authorized still requires Case release + ledger
    before any future Entra execute. This document describes the lab/observe
    stub: real_gate is false. Release records intent (HOLD_PENDING →
    ACTION_PENDING). The stub does not submit or execute MFA reset and does
    not call Entra or JSM.
servers:
  - url: http://127.0.0.1:8787
    description: local observe stub (real_gate false)
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK — observe/lab stub (real_gate false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/tenants/{tenant_id}/action-requests:
    post:
      operationId: createCase
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Created. mode=hold demo stops at HOLD_PENDING. No executor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '422':
          description: Missing Idempotency-Key or invalid body
  /v1/tenants/{tenant_id}/action-requests/{case_id}:
    get:
      operationId: getCase
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          description: Not found
  /v1/tenants/{tenant_id}/action-requests/{case_id}/release:
    post:
      operationId: releaseCase
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: >
            Release intent recorded. Hold demo path moves to ACTION_PENDING.
            Does not execute MFA reset (real_gate false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '409':
          description: Illegal transition / observe mode / missing ceiling / hold_expired
        '422':
          description: Missing Idempotency-Key
  /v1/tenants/{tenant_id}/action-requests/{case_id}/ledger:
    get:
      operationId: getLedger
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Append-only ledger view (intent and observe events only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerView'
        '404':
          description: Not found
components:
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string }
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  schemas:
    CaseStatus:
      type: string
      description: >
        Platform Case namespace — authoritative (case_sm.py).
        Verified against the handoff state machine. Do not substitute
        OPEN, ACTION_READY, CLOSED, HOLD, or AUTHORIZED_PENDING_RELEASE.
      enum:
        - RECEIVED
        - REJECTED
        - VERIFIED
        - ENRICHING
        - ASSESSED
        - OBSERVE
        - CHALLENGE_PENDING
        - HOLD_PENDING
        - DENIED
        - ACTION_PENDING
        - ACTION_SUBMITTED
        - ACTION_SUCCEEDED
        - ACTION_FAILED
        - ACTION_UNKNOWN
        - RECONCILED
        - BREAK_GLASS
    CreateCaseRequest:
      type: object
      required: [protected_action]
      properties:
        action_request_id: { type: string }
        protected_action: { type: string, enum: [mfa_reset, mfa_recovery] }
        mode: { type: string, enum: [observe, hold], default: hold }
        path_class: { type: string, default: jsm_primary }
        jsm_ticket_ref:
          type: object
          additionalProperties: true
        subject:
          type: object
          additionalProperties: true
    ReleaseRequest:
      type: object
      properties:
        action_ceiling_use:
          type: array
          items: { type: string }
          default: [mfa_methods_reset]
        approver_id: { type: string }
    Case:
      type: object
      required: [case_id, action_request_id, tenant_id, state]
      properties:
        case_id: { type: string }
        action_request_id: { type: string }
        tenant_id: { type: string }
        state:
          $ref: '#/components/schemas/CaseStatus'
        mode: { type: string }
        path_class: { type: string }
        decision_output: { type: string, nullable: true }
        action_ceiling:
          type: array
          items: { type: string }
        jsm_ticket_ref:
          type: object
          additionalProperties: true
        jsm_status_key:
          type: string
          nullable: true
          description: SoR evidence only — not a Case enum
        ledger_receipt_id: { type: string, nullable: true }
        real_gate:
          type: boolean
          enum: [false]
          description: Observe stub never arms the Action plane.
    Health:
      type: object
      required: [ok, service, real_gate]
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        real_gate: { type: boolean, enum: [false] }
        mode: { type: string, enum: [observe] }
        note: { type: string }
    LedgerEntry:
      type: object
      required: [receipt_id, kind, real_gate]
      properties:
        receipt_id: { type: string }
        tenant_id: { type: string }
        action_request_id: { type: string }
        case_id: { type: string }
        kind: { type: string }
        idempotency_key: { type: string }
        at: { type: string }
        real_gate: { type: boolean, enum: [false] }
        payload:
          type: object
          additionalProperties: true
    LedgerView:
      type: object
      required: [case_id, ledger, real_gate]
      properties:
        case_id: { type: string }
        real_gate: { type: boolean, enum: [false] }
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
